name: Build and FTP Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm ci --include=optional || npm install --include=optional
          npm rebuild

      - name: Build
        env:
          VITE_PIPEDREAM_WEBHOOK: ${{ secrets.VITE_PIPEDREAM_WEBHOOK }}
          VITE_PIPEDREAM_EMAIL_WEBHOOK: ${{ secrets.VITE_PIPEDREAM_EMAIL_WEBHOOK }}
          VITE_BREVO_FROM_EMAIL: ${{ secrets.VITE_BREVO_FROM_EMAIL }}
          VITE_BREVO_FROM_NAME: ${{ secrets.VITE_BREVO_FROM_NAME }}
          VITE_CAMPAIGN_ID: ${{ secrets.VITE_CAMPAIGN_ID }}
        run: npm run build

      - name: Copy .htaccess
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
            echo ".htaccess copied to dist/"
          else
            echo "Warning: public/.htaccess not found"
          fi

      - name: Verify build output
        run: |
          echo "=== Checking build output structure ==="
          ls -la dist/
          echo ""
          echo "=== Checking for index.html ==="
          if [ -f dist/index.html ]; then
            echo "✅ index.html exists"
            echo "Content of index.html (showing script tags):"
            grep -E "(script|link)" dist/index.html || cat dist/index.html
          else
            echo "❌ index.html NOT FOUND"
            exit 1
          fi
          echo ""
          echo "=== Checking for assets directory ==="
          if [ -d dist/assets ]; then
            echo "✅ assets directory exists"
            echo "All files in assets directory:"
            ls -la dist/assets/
          else
            echo "❌ assets directory NOT FOUND"
            exit 1
          fi
          echo ""
          echo "=== Checking for .htaccess ==="
          if [ -f dist/.htaccess ]; then
            echo "✅ .htaccess exists"
          else
            echo "⚠️ .htaccess NOT FOUND"
          fi

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_PATH }}
          dangerous-clean-slate: true
          log-level: verbose
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.next/**
            **/_next/**
            **/out/**
          include: |
            **/*

